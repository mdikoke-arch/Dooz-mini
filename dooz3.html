<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دوز کلاسیک</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; font-family: Tahoma, sans-serif; background: #0d0914; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .top-bar { width: 100%; max-width: 360px; display: flex; justify-content: space-between; margin-bottom: 20px; }
    .back-btn { background: #261b40; border: 1px solid #4a337a; padding: 8px 16px; border-radius: 12px; color: #fff; cursor: pointer; }
    .status { font-size: 18px; font-weight: bold; color: #38bdf8; margin-bottom: 20px; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; background: #181429; padding: 10px; border-radius: 20px; border: 2px solid #312450; }
    .cell { background: #0d0914; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; cursor: pointer; }
    .cell.x { color: #ff4d5a; }
    .cell.o { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="top-bar"><button class="back-btn" onclick="history.back()">← بازگشت</button></div>
  <div class="status" id="status">نوبت شما (X)</div>
  <div class="board" id="board">
    <div class="cell" onclick="makeMove(0)"></div><div class="cell" onclick="makeMove(1)"></div><div class="cell" onclick="makeMove(2)"></div>
    <div class="cell" onclick="makeMove(3)"></div><div class="cell" onclick="makeMove(4)"></div><div class="cell" onclick="makeMove(5)"></div>
    <div class="cell" onclick="makeMove(6)"></div><div class="cell" onclick="makeMove(7)"></div><div class="cell" onclick="makeMove(8)"></div>
  </div>
  <script>
    let board = Array(9).fill(''), turn = 'X', gameOver = false;
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function makeMove(i) {
      if (board[i] || gameOver) return;
      board[i] = turn;
      const el = document.getElementById('board').children[i];
      el.textContent = turn; el.classList.add(turn.toLowerCase());
      if (wins.some(w => w.every(idx => board[idx] === turn))) {
        document.getElementById('status').textContent = `بازیکن ${turn} برنده شد!`; gameOver = true; return;
      }
      if (!board.includes('')) { document.getElementById('status').textContent = 'مساوی شد!'; gameOver = true; return; }
      turn = turn === 'X' ? 'O' : 'X';
      document.getElementById('status').textContent = `نوبت ${turn === 'X' ? 'شما (X)' : 'حریف (O)'}`;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>واریز و برداشت</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    :root {
      --bg: #08070d;
      --card: #130f20;
      --card-2: #1b152e;
      --neon-purple: #a855f7;
      --neon-pink: #ec4899;
      --neon-cyan: #22d3ee;
      --text: #f5f3ff;
      --muted: #a19bb8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at top, #180e30 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 14px 14px 32px;
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; background: var(--card);
      border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 16px;
      margin-bottom: 14px;
    }
    .back-btn {
      background: var(--card-2); color: #e9d5ff;
      border: 1px solid rgba(168, 85, 247, 0.5); border-radius: 10px;
      padding: 7px 12px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .bal-badge {
      background: rgba(168, 85, 247, 0.16); border: 1.5px solid var(--neon-purple);
      color: #f3e8ff; padding: 6px 12px; border-radius: 18px;
      font-weight: bold; font-size: 13px;
    }
    .box {
      background: var(--card); border: 1.5px solid rgba(168, 85, 247, 0.38);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      border-radius: 18px; padding: 15px; margin-bottom: 14px;
    }
    .box-title { font-size: 14px; font-weight: bold; color: #e9d5ff; margin-bottom: 10px; }
    .card-box {
      background: #0c0a14; border: 1px dashed var(--neon-cyan);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px;
    }
    .btn-sm {
      border: none; border-radius: 9px; padding: 6px 10px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));
      color: #fff; font-weight: bold; font-size: 11px; cursor: pointer; white-space: nowrap;
    }
    .inp {
      width: 100%; background: #0c0a14; border: 1.5px solid rgba(168, 85, 247, 0.45);
      color: #fff; padding: 10px 12px; border-radius: 12px; margin-bottom: 10px;
      font-size: 13px; outline: none;
    }
    .inp:focus { border-color: var(--neon-cyan); }
    .btn {
      width: 100%; border: none; border-radius: 12px; padding: 11px 14px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));
      color: #fff; font-weight: bold; font-size: 13px; cursor: pointer;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.45);
    }
    .status-txt { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back-btn" onclick="location.href='index.html'">↪ بازگشت</button>
    <div style="font-weight:bold; font-size:14px;">💳 واریز و برداشت</div>
    <div class="bal-badge">💎 <span id="w-bal">0</span></div>
  </div>

  <div class="box">
    <div class="box-title">💳 واریز کارت به کارت</div>
    <div class="card-box">
      <div>
        <div id="owner-card-num" dir="ltr" style="font-weight:bold; color:#fff;">6277-6014-2080-7065</div>
        <div id="owner-card-name" style="font-size:11px; color:var(--muted); margin-top:2px;">به‌نام: مهدی لایقی</div>
      </div>
      <button class="btn-sm" onclick="copyOwnerCard()">کپی کارت</button>
    </div>
    <p class="status-txt" style="margin-top:0; margin-bottom:10px;">
      با زدن دکمه زیر وارد ربات می‌شوید تا شماره کارت نمایش داده شود، واریز کنید و رسید بفرستید تا پس از تایید حساب شما شارژ شود.
    </p>
    <button class="btn" onclick="goCardToBot()">رفتن به ربات و دریافت شماره کارت</button>
  </div>

  <div class="box">
    <div class="box-title">💠 شارژ با کیف پول TON (Tonkeeper)</div>
    <div id="ton-btn-box"></div>
    <div id="ton-status" class="status-txt">در حال آماده‌سازی TonConnect...</div>
    <div id="ton-charge-box" style="display:none; margin-top:10px;">
      <input id="ton-amount" class="inp" type="number" step="0.1" min="0.1" placeholder="مقدار TON برای شارژ (مثلاً 0.5)" />
      <button class="btn" style="background:linear-gradient(90deg,#0891b2,#7c3aed);" onclick="sendTonCharge()">پرداخت و شارژ با TON</button>
    </div>
  </div>

  <div class="box">
    <div class="box-title">💸 برداشت جایزه</div>
    <input id="wd-amount" class="inp" type="number" placeholder="مقدار الماس برداشت (حداقل 100)" />
    <input id="wd-dest" class="inp" type="text" placeholder="شماره کارت یا آدرس کیف پول TON" />
    <button class="btn" onclick="sendWithdraw()">ثبت درخواست برداشت</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const CARD_NUMBER = '6277601420807065';
    const CARD_HOLDER = 'مهدی لایقی';
    const TON_DEST_WALLET = 'UQAMHpeWXnFzkb_MsfnQptMVpLaocJcTlcALtSGmpJ2WnUYg';

    if (localStorage.getItem('gems_bal') === null) localStorage.setItem('gems_bal', '0');
    document.getElementById('w-bal').innerText = localStorage.getItem('gems_bal') || '0';

    let tonUI = null;
    let walletAddr = null;

    function copyOwnerCard() {
      if (navigator.clipboard) navigator.clipboard.writeText(CARD_NUMBER).catch(() => {});
      alert('شماره کارت مهدی لایقی کپی شد: 6277-6014-2080-7065');
    }

    function goCardToBot() {
      const uname = localStorage.getItem('player_username') || '';
      const payload = JSON.stringify({
        action: 'card_to_bot',
        card: CARD_NUMBER,
        holder: CARD_HOLDER,
        username: uname
      });
      if (tg && tg.initData) {
        try {
          tg.sendData(payload);
          return;
        } catch (e) {}
      }
      alert('شماره کارت: 6277-6014-2080-7065 به نام مهدی لایقی\nبرای بازگشت به ربات، مینی‌اپ را از دکمه ربات باز کنید.');
    }

    function initWalletTon() {
      if (!window.TON_CONNECT_UI) {
        document.getElementById('ton-status').innerText = 'کتابخانه TonConnect لود نشد (اینترنت یا VPN را چک کنید).';
        return;
      }
      try {
        tonUI = new TON_CONNECT_UI.TonConnectUI({
          manifestUrl: 'https://mdikoke-arch.github.io/Dooz-mini/tonconnect-manifest.json',
          buttonRootId: 'ton-btn-box'
        });
        document.getElementById('ton-status').innerText = 'برای اتصال به Tonkeeper روی دکمه بالا بزنید.';

        tonUI.onStatusChange(w => {
          if (w && w.account) {
            walletAddr = w.account.address;
            document.getElementById('ton-status').innerText = 'ولت متصل شد: ' + walletAddr.slice(0, 6) + '...' + walletAddr.slice(-4);
            document.getElementById('ton-charge-box').style.display = 'block';
          } else {
            walletAddr = null;
            document.getElementById('ton-status').innerText = 'ولت متصل نیست.';
            document.getElementById('ton-charge-box').style.display = 'none';
          }
        });
      } catch (e) {
        document.getElementById('ton-status').innerText = 'خطا در راه‌اندازی TonConnect.';
      }
    }

    async function sendTonCharge() {
      if (!tonUI || !walletAddr) {
        alert('ابتدا به Tonkeeper متصل شوید.');
        return;
      }
      const tonVal = parseFloat(document.getElementById('ton-amount').value);
      if (!tonVal || tonVal <= 0) {
        alert('مقدار TON معتبر وارد کنید (مثلاً 0.5).');
        return;
      }
      const nanoAmount = Math.round(tonVal * 1e9).toString();
      try {
        const res = await tonUI.sendTransaction({
          validUntil: Math.floor(Date.now() / 1000) + 300,
          messages: [{ address: TON_DEST_WALLET, amount: nanoAmount }]
        });
        if (tg) {
          tg.sendData(JSON.stringify({
            action: 'ton_deposit',
            ton_amount: tonVal,
            to_wallet: TON_DEST_WALLET,
            boc: res.boc,
            wallet: walletAddr
          }));
        }
        alert('✅ تراکنش TON ارسال شد.');
      } catch (e) {
        alert('تراکنش لغو شد.');
      }
    }

    function sendWithdraw() {
      const amt = parseInt(document.getElementById('wd-amount').value, 10);
      const dest = document.getElementById('wd-dest').value.trim();
      const bal = parseInt(localStorage.getItem('gems_bal') || '0', 10);
      if (!amt || amt < 100) { alert('حداقل برداشت ۱۰۰ الماس است.'); return; }
      if (amt > bal) { alert('موجودی کافی نیست.'); return; }
      if (dest.length < 6) { alert('مقصد معتبر وارد کنید.'); return; }
      if (tg) {
        try { tg.sendData(JSON.stringify({ action: 'withdraw', amount: amt, destination: dest })); } catch (e) {}
      }
      alert('✅ درخواست برداشت ثبت شد.');
    }

    initWalletTon();
  </script>
</body>
</html>

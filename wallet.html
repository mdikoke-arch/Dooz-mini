<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کیف پول و واریز | Dooz-mini</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 18px;
      font-family: sans-serif;
      background: #0d0717;
      color: #ffffff;
    }
    .card {
      max-width: 440px;
      margin: 16px auto;
      background: #190f2b;
      border: 1px solid #5e2ced;
      border-radius: 16px;
      padding: 18px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      color: #e9d8fd;
    }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 13px;
      color: #cbb8ff;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid #3c266e;
      background: #0e071a;
      color: #fff;
      font-size: 15px;
    }
    .btn-primary {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #7c3aed;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-back {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #4c2d8a;
      border-radius: 12px;
      background: transparent;
      color: #d8c8ff;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>واریز کارت‌به‌کارت</h2>
    <label for="deposit-amount">مبلغ (تومان)</label>
    <input id="deposit-amount" type="number" value="100000" min="1000" />

    <label for="card-ref">۴ رقم آخر کارت یا کد پیگیری</label>
    <input id="card-ref" type="text" placeholder="مثلاً 5892 یا کد پیگیری" />

    <button id="wallet-card-submit" class="btn-primary" type="button" onclick="window.submitCardDeposit()">
      ثبت درخواست واریز کارت‌به‌کارت
    </button>
    <button class="btn-back" type="button" onclick="window.location.href='index.html'">
      بازگشت به صفحه اصلی
    </button>
  </div>

  <script src="app.js"></script>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>

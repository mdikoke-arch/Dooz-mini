<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>میز دوز دونفره | SAV</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#090512;--card:#140c24;--card2:#1c1133;--neon:#a855f7;--neon2:#ec4899;--gold:#facc15;--ok:#34d399;--err:#f87171;--txt:#f5f3ff;--mut:#a78bfa;--bd:rgba(168,85,247,.26)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;padding:0;overflow-x:hidden;background:radial-gradient(circle at top,#241046 0%,var(--bg) 72%);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
    .app{max-width:440px;margin:0 auto;padding:14px}
    .top{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;margin-bottom:12px}
    .back{border:none;border-radius:10px;padding:7px 12px;background:#241342;color:#f3e8ff;font-weight:800;cursor:pointer}
    .bal{color:var(--gold);font-weight:900;font-size:14px}
    .box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;text-align:center}
    .sub{font-size:12px;color:var(--mut);margin-bottom:8px}
    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:14px auto}
    .cell{aspect-ratio:1/1;border:1px solid var(--bd);border-radius:16px;background:var(--card2);font-size:34px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .cell.x{color:#f472b6}.cell.o{color:#38bdf8}
    .status{min-height:24px;font-size:13px;font-weight:800;color:var(--ok);margin-top:8px}
    .status.err{color:var(--err)}
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <button type="button" class="back" id="goBack">← لابی</button>
      <div>❌⭕ میز دوز</div>
      <div class="bal" id="savShow">0 SAV</div>
    </div>
    <div class="box">
      <div class="sub" id="roomInfo">در حال اتصال به میز...</div>
      <div class="board" id="board"></div>
      <div class="status" id="status">منتظر اتصال هر دو بازیکن...</div>
    </div>
  </div>
  <script>
    const DB_URL="https://savash-c4207-default-rtdb.europe-west1.firebasedatabase.app",K="savash_coin_state_v1";
    const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
    if(tg){tg.ready();tg.expand()}
    const qs=new URLSearchParams(location.search);
    const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    const uid=qs.get("uid")||((u&&u.id)?String(u.id):"guest");
    const roomId=qs.get("room")||"dooz_demo";
    const mySym=(qs.get("sym")==="1")?"O":"X";
    let st=(()=>{const d={name:(u&&u.first_name)||"کاربر",sav:0};try{return{...d,...JSON.parse(localStorage.getItem(K)||"{}"),name:d.name}}catch(_){return d}})();
    let room=null,sending=false;
    const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    async function fbGet(p){const r=await fetch(`${DB_URL}${p}.json`);return r.json()}
    async function fbPut(p,d){await fetch(`${DB_URL}${p}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})}
    async function fbPatch(p,d){await fetch(`${DB_URL}${p}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})}

    function drawBal(){
      document.getElementById("savShow").textContent=Number(st.sav||0).toLocaleString("en-US")+" SAV";
    }

    function calcWinner(g){
      for(const[a,b,c]of lines){
        if(g[a]&&g[a]===g[b]&&g[a]===g[c])return g[a];
      }
      if(g.every(Boolean))return "draw";
      return "";
    }

    function render(){
      drawBal();
      const b=room&&Array.isArray(room.board)?room.board:Array(9).fill("");
      const el=document.getElementById("board");el.innerHTML="";
      for(let i=0;i<9;i++){
        const v=b[i]||"";
        const btn=document.createElement("button");btn.type="button";
        btn.className="cell"+(v==="X"?" x":v==="O"?" o":"");
        btn.textContent=v;
        btn.onclick=()=>playAt(i);
        el.appendChild(btn);
      }
      const amt=Number((room&&room.bet)||qs.get("bet")||100);
      const prize=Math.round(amt*2*0.9);
      document.getElementById("roomInfo").textContent=`نماد تو: ${mySym} • شرط: ${amt} SAV • جایزه خالص: ${prize} SAV`;

      const stEl=document.getElementById("status");
      if(!room){stEl.textContent="در حال بارگذاری میز...";stEl.className="status";return}
      if(!room.guestId){
        stEl.textContent="منتظر قبول دعوت دوستت در لابی...";
        stEl.className="status";
        return;
      }
      if(room.winner==="X"||room.winner==="O"){
        stEl.className=room.winner===mySym?"status":"status err";
        stEl.textContent=(room.winner===mySym)?`🏆 بردی! +${prize} SAV به موجودی‌ات رفت`:`❌ حریف (${room.winner}) برد!`;
        return;
      }
      if(room.winner==="draw"){
        stEl.className="status";
        stEl.textContent=`🤝 مساوی شد! ${amt} SAV برگشت`;
        return;
      }
      if(room.turn===mySym){
        stEl.className="status";
        stEl.textContent=`نوبت توست (${mySym}) — یک خانه بزن`;
      }else{
        stEl.className="status err";
        stEl.textContent=`نوبت حریف (${room.turn}) است...`;
      }
    }

    async function settlePayout(r){
      if(!r||r.payoutDone)return;
      const amt=Number(r.bet||100);
      const prize=Math.round(amt*2*0.9);
      if(r.winner===mySym){
        st.sav=Number(st.sav||0)+prize;
        localStorage.setItem(K,JSON.stringify(st));
        await fbPut(`/users/${uid}/sav`,st.sav);
        await fbPatch(`/rooms/${roomId}`,{payoutDone:true});
      }else if(r.winner==="draw"){
        st.sav=Number(st.sav||0)+amt;
        localStorage.setItem(K,JSON.stringify(st));
        await fbPut(`/users/${uid}/sav`,st.sav);
        await fbPatch(`/rooms/${roomId}`,{payoutDone:true});
      }
    }

    async function syncRoom(){
      try{
        const s=await fbGet(`/users/${uid}/sav`);
        if(typeof s==="number"){st.sav=s;localStorage.setItem(K,JSON.stringify(st))}
      }catch(_){}
      try{
        const r=await fbGet(`/rooms/${roomId}`);
        if(r){
          room=r;
          if(room.winner&&!room.payoutDone){await settlePayout(room)}
          render();
        }
      }catch(_){}
    }

    async function playAt(i){
      if(sending||!room||!room.guestId||room.winner)return;
      if(room.turn!==mySym)return;
      const b=Array.isArray(room.board)?[...room.board]:Array(9).fill("");
      if(b[i])return;
      sending=true;
      b[i]=mySym;
      const w=calcWinner(b);
      const nextTurn=(mySym==="X")?"O":"X";
      try{
        await fbPatch(`/rooms/${roomId}`,{board:b,turn:nextTurn,winner:w});
        await syncRoom();
      }finally{sending=false}
    }

    document.getElementById("goBack").onclick=()=>{location.href="../index.html"};
    render();syncRoom();setInterval(syncRoom,1500);
  </script>
</body>
</html>

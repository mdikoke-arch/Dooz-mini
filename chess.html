<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>شطرنج</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#0e110d;--gold:#facc15;--green-bg:radial-gradient(circle at top,#174931 0%,#0a1f15 70%);--text:#f3f4f6;--muted:#9ca3af;--border:rgba(255,255,255,.11)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;padding:0;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
    .screen{display:none;min-height:100vh;padding:14px;max-width:460px;margin:0 auto}.screen.active{display:flex;flex-direction:column}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:40}.sheet-backdrop.open{display:flex}
    .sheet{width:100%;max-width:460px;background:#191b18;border-top-left-radius:22px;border-top-right-radius:22px;padding:12px 16px 24px;border-top:1px solid var(--border)}
    .sheet-handle{width:42px;height:4px;border-radius:999px;background:rgba(255,255,255,.22);margin:0 auto 14px}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.sheet-title{font-size:20px;font-weight:800;color:var(--gold)}
    .circle-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.07);color:#fff;font-size:16px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .sheet-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
    .mode-card{width:100%;border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;cursor:pointer;border:1px solid var(--border);color:#fff}
    .mode-card.solo{background:#262925}.mode-card.pub{background:linear-gradient(135deg,#1b6b45,#12482e);border-color:rgba(52,211,153,.35)}.mode-card.friends{background:linear-gradient(135deg,#5d4b18,#3d3110);border-color:rgba(250,204,21,.35)}
    .mode-title{font-size:16px;font-weight:800;margin-bottom:3px}.mode-desc{font-size:12px;color:#e5e7eb;line-height:1.45}
    .pill-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.35);margin-right:6px}.mode-ico{font-size:24px}
    #screen-setup{background:var(--green-bg);justify-content:flex-start}.top-bar-simple{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .page-gold-title{text-align:center;font-size:22px;font-weight:900;color:var(--gold);margin:2px 0 16px}.setup-box{background:#171a16;border:1px solid var(--border);border-radius:20px;padding:18px 16px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
    .setup-label{text-align:center;font-size:15px;font-weight:700;margin:14px 0 10px;color:#f3f4f6}.setup-label:first-child{margin-top:0}
    .level-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#232722;padding:5px;border-radius:12px}
    .level-btn,.stake-btn{border:none;border-radius:9px;padding:9px 6px;background:transparent;color:#d1d5db;font-weight:700;font-size:13px;cursor:pointer}.level-btn.active,.stake-btn.active{background:var(--gold);color:#11130f}
    .color-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.color-card{background:#222621;border:1.5px solid var(--border);border-radius:14px;padding:12px;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}.color-card.active{border-color:var(--gold);background:#2c2918}
    .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}.theme-item{background:#222621;border:1.5px solid transparent;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#e5e7eb;cursor:pointer}.theme-item.active{border-color:var(--gold);background:#2b2718;color:var(--gold)}
    .mini-board{width:42px;height:42px;border-radius:6px;overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr)}.start-gold-btn{width:100%;border:none;border-radius:14px;padding:13px;background:var(--gold);color:#11130f;font-size:16px;font-weight:900;cursor:pointer}
    #screen-play{background:#10130f;justify-content:flex-start}.play-header{text-align:center;margin-bottom:4px}
    .turn-pill{display:inline-block;margin:0 auto 10px;padding:5px 16px;border-radius:999px;background:#262214;border:1px solid rgba(250,204,21,.35);color:var(--gold);font-size:12px;font-weight:700;min-height:28px;line-height:18px}.turn-pill.check-alert{background:#3b1418;border-color:#f87171;color:#fca5a5}
    .player-strip{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:6px 0}.p-avatar{width:38px;height:38px;border-radius:50%;background:#232822;border:1.5px solid rgba(250,204,21,.45);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold);font-size:15px}
    .board-wrap{width:100%;aspect-ratio:1/1;border:2px solid #c99b2e;border-radius:8px;overflow:hidden;background:#1a1e18;margin:8px 0 12px;box-shadow:0 10px 28px rgba(0,0,0,.5)}.board-8x8{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
    .sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;overflow:hidden}.sq.last-move{box-shadow:inset 0 0 0 2.5px rgba(250,204,21,.85)}.sq.last-move::before{content:"";position:absolute;inset:0;background:rgba(250,204,21,.24);pointer-events:none}.sq.in-check{box-shadow:inset 0 0 0 3px #ef4444;background-color:rgba(239,68,68,.45)!important}
    .piece-glyph{position:relative;z-index:2;font-size:clamp(22px,6.2vw,34px);font-family:"Noto Sans Symbols 2","Segoe UI Symbol","Apple Color Emoji",sans-serif;display:inline-block;transform:translateY(1px)}.piece-white{color:#fff6d6;-webkit-text-stroke:.7px #5c4312;text-shadow:0 2px 3px rgba(0,0,0,.75)}.piece-black{color:#16181d;-webkit-text-stroke:.5px rgba(255,255,255,.22);text-shadow:0 1px 2px rgba(255,255,255,.25)}
    .sq.sel{box-shadow:inset 0 0 0 3px #facc15;filter:brightness(1.14)}.sq.tgt::after{content:"";width:13px;height:13px;border-radius:50%;background:rgba(250,204,21,.72);border:1.5px solid rgba(0,0,0,.45);position:absolute;z-index:3}
    .coord-r{position:absolute;top:2px;left:3px;font-size:9px;opacity:.85;font-weight:800;pointer-events:none;z-index:1}.coord-c{position:absolute;bottom:1px;right:3px;font-size:9px;opacity:.85;font-weight:800;pointer-events:none;z-index:1}
    .exit-red-btn{width:100%;border:none;border-radius:12px;padding:11px;background:#dc2626;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:6px;box-shadow:0 6px 18px rgba(220,38,38,.35)}
    .confirm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}.confirm-backdrop.open{display:flex}
    .confirm-box{width:100%;max-width:360px;background:#191c18;border:1px solid var(--border);border-radius:18px;padding:20px 16px;text-align:center;box-shadow:0 14px 36px rgba(0,0,0,.6)}.confirm-title{font-size:16px;font-weight:800;margin-bottom:18px;color:#f9fafb}
    .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn-yes{border:none;border-radius:12px;padding:11px;background:#dc2626;color:#fff;font-weight:800;font-size:14px;cursor:pointer}.btn-no{border:1px solid var(--border);border-radius:12px;padding:11px;background:#252924;color:#f3f4f6;font-weight:800;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
  <div class="sheet-backdrop open" id="modeSheet">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><div class="sheet-title">شطرنج</div><button type="button" class="circle-btn" id="closeSheetBtn">✕</button></div>
      <div class="sheet-sub">چطوری می‌خوای بازی کنی؟</div>
      <button type="button" class="mode-card solo" id="btnSolo"><div><div class="mode-title">تک‌نفره</div><div class="mode-desc">همین حالا با ربات‌ها بازی کن؛ منتظر کسی نمی‌مونی</div></div><div class="mode-ico">🤖</div></button>
      <button type="button" class="mode-card pub" id="btnPublic"><div><div class="mode-title">اتاق عمومی (شرطی)</div><div class="mode-desc">با بازیکن‌های تصادفی هم‌میز شو؛ بازی خودش شروع می‌شه</div></div><div class="mode-ico">⚡</div></button>
      <button type="button" class="mode-card friends" id="btnFriends"><div><div class="mode-title">با دوستام <span class="pill-badge">میزبان: خودت</span></div><div class="mode-desc">میزبان خودتی؛ دوستات رو دعوت کن و هر وقت آماده بودی شروع کن</div></div><div class="mode-ico">🔒</div></button>
    </div>
  </div>
  <section class="screen" id="screen-setup"><div>
    <div class="top-bar-simple"><button type="button" class="circle-btn" id="backToModeBtn">→</button><div style="font-size:12px;color:#d1fae5;font-weight:700;" id="setupGemTxt">💎 ۰ الماس</div></div>
    <div class="page-gold-title">شطرنج</div>
    <div class="setup-box">
      <div id="soloControls">
        <div class="setup-label">♟ سطح حریفت رو انتخاب کن</div>
        <div class="level-bar"><button type="button" class="level-btn" data-lvl="easy">آسان</button><button type="button" class="level-btn active" data-lvl="medium">متوسط</button><button type="button" class="level-btn" data-lvl="hard">سخت</button></div>
        <div class="setup-label">رنگ مهره‌ها</div>
        <div class="color-row"><button type="button" class="color-card" data-col="black"><span>♟</span><span>سیاه</span></button><button type="button" class="color-card active" data-col="white"><span>♔</span><span>سفید</span></button></div>
      </div>
      <div id="publicControls" style="display:none;">
        <div class="setup-label">💎 مبلغ شرط رو انتخاب کن</div>
        <div class="level-bar"><button type="button" class="stake-btn active" data-stake="100">100 💎</button><button type="button" class="stake-btn" data-stake="200">200 💎</button><button type="button" class="stake-btn" data-stake="300">300 💎</button></div>
      </div>
      <div class="setup-label">رنگ صفحه</div>
      <div class="theme-grid" id="themeGrid">
        <button type="button" class="theme-item" data-theme="gram"><div class="mini-board" id="mb-gram"></div><span>gram</span></button>
        <button type="button" class="theme-item" data-theme="blue"><div class="mini-board" id="mb-blue"></div><span>آبی</span></button>
        <button type="button" class="theme-item" data-theme="brown"><div class="mini-board" id="mb-brown"></div><span>قهوه‌ای</span></button>
        <button type="button" class="theme-item active" data-theme="green"><div class="mini-board" id="mb-green"></div><span>سبز</span></button>
      </div>
      <button type="button" class="start-gold-btn" id="startMatchBtn">شروع بازی</button>
    </div>
  </div></section>
  <section class="screen" id="screen-play"><div>
    <div class="play-header"><div style="font-size:20px;font-weight:900;color:var(--gold);">شطرنج</div></div>
    <div style="text-align:center;"><div class="turn-pill" id="turnBadge">نوبت شماست</div></div>
    <div class="player-strip"><div style="font-weight:800;font-size:14px;" id="oppName">حریف تصادفی</div><div class="p-avatar" id="oppAvatar">ح</div></div>
    <div class="board-wrap"><div class="board-8x8" id="chessBoard"></div></div>
    <div class="player-strip"><div style="font-weight:800;font-size:14px;" id="meName">کاربر</div><div class="p-avatar" id="meAvatar">ک</div></div>
    <button type="button" class="exit-red-btn" id="openExitConfirmBtn">خروج</button>
  </div></section>
  <div class="confirm-backdrop" id="exitConfirmModal"><div class="confirm-box">
    <div class="confirm-title">آیا مایل به خروج هستید؟</div>
    <div class="confirm-actions"><button type="button" class="btn-yes" id="confirmExitYes">بله</button><button type="button" class="btn-no" id="confirmExitNo">خیر</button></div>
  </div></div>

<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Dooz-mini</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box;font-family:sans-serif}body{margin:0;padding:14px 14px 80px;background:#0a0612;color:#fff}.card{background:#170d29;border:1px solid #5b2fc9;border-radius:16px;padding:14px;margin-bottom:12px}.url{background:#0d0718;border:1px dashed #6d28d9;border-radius:10px;padding:8px;font-size:11px;word-break:break-all;margin:8px 0}.btn{padding:10px;border:none;border-radius:10px;background:#7c3aed;color:#fff;font-weight:bold;cursor:pointer;width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{background:#160c27;border:1px dashed #391d6b;border-radius:12px;padding:16px;text-align:center;color:#a78bfa;font-size:12px}.item{display:flex;justify-content:space-between;background:#160c27;border:1px solid #391d6b;border-radius:12px;padding:10px 12px;margin-bottom:8px}</style></head><body><div class="card"><b>دعوت از دوستان</b><div id="inv-link" class="url"></div><div class="row"><button class="btn" type="button" onclick="copyInv()">کپی لینک</button><button class="btn" style="background:#4c1d95" type="button" onclick="shareInv()">ارسال به دوست</button></div></div><b>لیست دوستان دعوت‌شده</b><div id="f-list" style="margin-top:8px;"></div><script>
var BOT="Starsgameir_bot",tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();}catch(e){}}
var me=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{id:8359766039,first_name:"SavasH"};
var myLink="https://t.me/"+BOT+"?start=ref_"+me.id;
document.getElementById("inv-link").textContent=myLink;
function getRefId(){
  var p=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||"";
  if(!p){var q=new URLSearchParams(location.search);p=q.get("start")||q.get("tgWebAppStartParam")||"";}
  return p.indexOf("ref_")===0?p.slice(4).trim():"";
}
function loadF(id){try{return JSON.parse(localStorage.getItem("ref_list_"+id)||"[]");}catch(e){return[];}}
function saveF(id,arr){try{localStorage.setItem("ref_list_"+id,JSON.stringify(arr));}catch(e){}}
var rId=getRefId();
if(rId&&String(rId)!==String(me.id)){
  var arr=loadF(rId);
  if(!arr.some(function(x){return String(x.id)===String(me.id);})){
    arr.push({id:me.id,name:me.first_name||"کاربر",gems:0});
    saveF(rId,arr);
  }
}
function render(){
  var list=loadF(me.id),box=document.getElementById("f-list");
  if(!list.length){box.innerHTML='<div class="empty">هنوز کسی دعوت نشده است.</div>';return;}
  box.innerHTML=list.map(function(x){return '<div class="item"><b>'+x.name+'</b><span>💎 '+x.gems+'</span></div>';}).join("");
}
window.copyInv=function(){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(myLink).then(function(){alert("کپی شد");}).catch(function(){prompt("لینک:",myLink);});}
  else prompt("لینک:",myLink);
};
window.shareInv=function(){
  var u="https://t.me/share/url?url="+encodeURIComponent(myLink)+"&text="+encodeURIComponent("بیا تو ربات!");
  if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,"_blank");
};
render();
</script></body></html>

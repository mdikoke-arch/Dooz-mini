<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ساواش گیم | SAV</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#090512;--card:#140c24;--neon:#a855f7;--neon2:#ec4899;--gold:#facc15;--txt:#f5f3ff;--mut:#a78bfa;--bd:rgba(168,85,247,.26)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;padding:0;overflow-x:hidden;background:radial-gradient(circle at top,#241046 0%,var(--bg) 72%);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
    .app{max-width:460px;margin:0 auto;padding:14px 14px 86px}
    .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 14px;margin-bottom:14px}
    .user-box{display:flex;align-items:center;gap:10px}
    .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff}
    .uname{font-size:14px;font-weight:800}.uid{font-size:11px;color:var(--mut)}
    .sav-pill{display:flex;align-items:center;gap:7px;background:#1e1236;border:1px solid rgba(250,204,21,.45);padding:6px 12px;border-radius:999px;font-weight:900;font-size:14px;color:var(--gold)}
    .sav-coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fef08a,#eab308 65%,#a16207);border:1.5px solid #fffbeb;color:#422006;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
    .hero{background:linear-gradient(135deg,#2b1254,#170b2e);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .hero h2{margin:0 0 4px;font-size:17px;font-weight:900}.hero p{margin:0;font-size:12px;color:#c4b5fd}
    .daily-btn{border:none;border-radius:12px;padding:10px 12px;background:linear-gradient(135deg,#facc15,#f59e0b);color:#1f1300;font-weight:900;font-size:12px;cursor:pointer}
    .daily-btn:disabled{opacity:.5}
    .sec-title{font-size:15px;font-weight:900;color:#e9d5ff;margin:10px 2px}
    .games-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .g-card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 12px;text-align:center;cursor:pointer}
    .g-card.live{border-color:rgba(236,72,153,.55);box-shadow:0 0 20px rgba(168,85,247,.2)}
    .g-card.soon{opacity:.62;cursor:default}
    .g-ico{font-size:34px;margin-bottom:6px}.g-name{font-size:15px;font-weight:900;margin-bottom:4px}
    .g-tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(168,85,247,.2);color:#e9d5ff}
    .g-card.live .g-tag{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#fff}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="user-box">
        <div class="avatar" id="avTxt">ک</div>
        <div><div class="uname" id="nameTxt">کاربر</div><div class="uid" id="idTxt">ID: ---</div></div>
      </div>
      <div class="sav-pill"><span class="sav-coin">S</span><span id="savBal">0 SAV</span></div>
    </header>
    <div class="hero">
      <div><h2>میدان رقابت ساواش</h2><p>با کوین SAV شرط ببند و جایزه ببر</p></div>
      <button type="button" class="daily-btn" id="dailyBtn">🎁 +15 SAV</button>
    </div>
    <div class="sec-title">🎮 بازی‌ها</div>
    <div class="games-grid">
      <div class="g-card live" id="openDooz"><div class="g-ico">❌⭕</div><div class="g-name">دوز</div><div class="g-tag">100-300 SAV</div></div>
      <div class="g-card live" id="openChess"><div class="g-ico">♟️</div><div class="g-name">شطرنج</div><div class="g-tag">100-300 SAV</div></div>
      <div class="g-card soon"><div class="g-ico">🃏</div><div class="g-name">حکم</div><div class="g-tag">به زودی</div></div>
      <div class="g-card soon"><div class="g-ico">🎲</div><div class="g-name">تخته نرد</div><div class="g-tag">به زودی</div></div>
    </div>
  </div>
  <script>
    const DB_URL="https://savash-c4207-default-rtdb.europe-west1.firebasedatabase.app",K="savash_coin_state_v1";
    const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
    if(tg){tg.ready();tg.expand()}
    const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    const uid=(u&&u.id)?String(u.id):("u_"+(localStorage.getItem("savash_gid")||(()=>{const g=Math.random().toString(36).slice(2,8);localStorage.setItem("savash_gid",g);return g})()));
    let st=(()=>{const d={name:(u&&u.first_name)||"کاربر",sav:0,lastDaily:""};try{return{...d,...JSON.parse(localStorage.getItem(K)||"{}"),name:d.name}}catch(_){return d}})();
    function save(){localStorage.setItem(K,JSON.stringify(st));render()}
    function render(){
      const t=Number(st.sav||0).toLocaleString("en-US")+" SAV";
      document.getElementById("nameTxt").textContent=st.name;document.getElementById("idTxt").textContent="ID: "+uid;
      document.getElementById("avTxt").textContent=(st.name||"ک").trim().charAt(0).toUpperCase();
      document.getElementById("savBal").textContent=t;
      const td=new Date().toISOString().slice(0,10),b=document.getElementById("dailyBtn");
      b.disabled=(st.lastDaily===td);b.textContent=(st.lastDaily===td)?"✅ دریافت شد":"🎁 +15 SAV";
    }
    async function pull(){try{const r=await fetch(`${DB_URL}/users/${uid}/sav.json`),v=await r.json();if(typeof v==="number"){st.sav=v;save()}}catch(_){}}
    document.getElementById("dailyBtn").onclick=async()=>{
      const td=new Date().toISOString().slice(0,10);if(st.lastDaily===td)return;
      st.sav=(Number(st.sav)||0)+15;st.lastDaily=td;save();
      try{await fetch(`${DB_URL}/users/${uid}/sav.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(st.sav)})}catch(_){}
    };
    document.getElementById("openDooz").onclick=()=>{location.href="dooz/dooz.html"};
    document.getElementById("openChess").onclick=()=>{location.href="chess.html"};
    render();pull();
  </script>
</body>
</html>

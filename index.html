<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>دبرنا آنلاین | StarsGame</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; user-select: none; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; color: #38bdf8; }
    p.sub { font-size: 13px; color: #94a3b8; margin: 0 0 20px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: 0.2s; }
    .btn-4 { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; }
    .btn-6 { background: linear-gradient(135deg, #7c3aed, #8b5cf6); color: white; }
    .btn-share { background: #10b981; color: #064e3b; margin-top: 12px; }
    .btn-leave { background: #ef4444; color: white; margin-top: 8px; font-size: 13px; padding: 10px; }
    .btn:active { transform: scale(0.97); }
    .status-box { background: #0f172a; border-radius: 12px; padding: 16px; margin: 16px 0; border: 1px dashed #475569; }
    .count-big { font-size: 28px; font-weight: bold; color: #fbbf24; margin: 6px 0; }
    .player-list { list-style: none; padding: 0; margin: 12px 0 0; text-align: right; }
    .player-list li { background: #1e293b; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #0284c7; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- بخش انتخاب میز -->
  <div id="lobby-menu" class="card">
    <h1>🎲 دبرنا چندنفره</h1>
    <p class="sub">ظرفیت میز رو انتخاب کن و لینک رو برای دوستات بفرست</p>
    <button class="btn btn-4" onclick="createRoom(4)">ساخت میز ۴ نفره</button>
    <button class="btn btn-6" onclick="createRoom(6)">ساخت میز ۶ نفره</button>
  </div>

  <!-- بخش اتاق انتظار و شمارش لحظه‌ای -->
  <div id="waiting-room" class="card hidden">
    <h1 id="room-title">اتاق انتظار دبرنا</h1>
    <div class="status-box">
      <div style="font-size: 13px; color: #94a3b8;">وضعیت اتصال بازیکنان:</div>
      <div class="count-big"><span id="joined-count">0</span> / <span id="max-count">4</span> نفر</div>
      <div id="remaining-text" style="font-size: 14px; color: #38bdf8; font-weight: bold;">در حال اتصال...</div>
    </div>

    <ul id="players-ul" class="player-list"></ul>

    <button class="btn btn-share" onclick="shareRoomLink()">📤 ارسال لینک دعوت به دوستان</button>
    <button class="btn btn-leave" onclick="leaveRoom()">خروج از میز</button>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>

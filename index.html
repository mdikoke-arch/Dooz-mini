<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>دبرنا SVH | دعوت با آیدی تلگرام</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; user-select: none; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      color: #f8fafc;
      background: radial-gradient(circle at top, #1e293b 0%, #090d16 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .topbar {
      width: 100%;
      max-width: 430px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }
    .svh-pill {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #111827;
      font-weight: bold;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(99, 102, 241, 0.28);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      text-align: center;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      margin: 0 0 18px;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform 0.14s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-4 {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
    }
    .btn-6 {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: #fff;
    }
    .btn-shop {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.45);
      font-size: 14px;
    }
    .btn-invite {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ecfdf5;
      margin-top: 8px;
    }
    .btn-leave {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      font-size: 13px;
      padding: 10px;
    }
    .invite-box {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      margin-top: 12px;
      text-align: right;
    }
    .input-id {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #020617;
      color: #f8fafc;
      font-size: 14px;
      margin-top: 8px;
      outline: none;
    }
    .input-id:focus { border-color: #38bdf8; }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .pack {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 6px;
      cursor: pointer;
    }
    .pack-svh { color: #fbbf24; font-weight: bold; font-size: 14px; }
    .pack-price { color: #94a3b8; font-size: 11px; margin-top: 4px; }
    .status-box {
      background: rgba(2, 6, 23, 0.75);
      border: 1px dashed rgba(148, 163, 184, 0.35);
      border-radius: 14px;
      padding: 14px;
      margin: 14px 0;
    }
    .count-big { font-size: 28px; font-weight: bold; color: #fbbf24; margin: 6px 0; }
    .player-list { list-style: none; padding: 0; margin: 12px 0 0; text-align: right; }
    .player-list li {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.15);
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge { background: #0284c7; color: #fff; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
    .toast {
      position: fixed;
      bottom: 18px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #38bdf8;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 99;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="topbar">
    <span id="user-label" style="font-size: 13px; color: #cbd5e1;">بازیکن</span>
    <span class="svh-pill">🪙 <span id="svh-balance">0</span> SVH</span>
  </div>

  <!-- منوی اصلی دبرنا -->
  <div id="lobby-menu" class="card">
    <h1>🎲 دبرنا چندنفره</h1>
    <p class="sub">میز ۴ یا ۶ نفره بساز و دوستانت را با <b>آیدی عددی تلگرام</b> یا یوزرنیم دعوت کن</p>

    <button id="btn-create-4" type="button" class="btn btn-4">ساخت میز ۴ نفره • ورود ۲۰ SVH</button>
    <button id="btn-create-6" type="button" class="btn btn-6">ساخت میز ۶ نفره • ورود ۳۰ SVH</button>
    <button id="btn-toggle-shop" type="button" class="btn btn-shop">🛒 فروشگاه کوین SVH</button>

    <div id="shop-box" class="hidden">
      <div style="font-size: 13px; color: #fbbf24; margin-top: 8px;">خرید بسته کوین SVH:</div>
      <div class="shop-grid">
        <div class="pack" data-svh="100" data-stars="25">
          <div class="pack-svh">+100 SVH</div>
          <div class="pack-price">25 ⭐</div>
        </div>
        <div class="pack" data-svh="300" data-stars="65">
          <div class="pack-svh">+300 SVH</div>
          <div class="pack-price">65 ⭐</div>
        </div>
        <div class="pack" data-svh="700" data-stars="140">
          <div class="pack-svh">+700 SVH</div>
          <div class="pack-price">140 ⭐</div>
        </div>
      </div>
    </div>
  </div>

  <!-- اتاق انتظار و دعوت با آیدی -->
  <div id="waiting-room" class="card hidden">
    <h1 id="room-title">اتاق انتظار دبرنا</h1>
    <div class="status-box">
      <div style="font-size: 12px; color: #94a3b8;">تعداد بازیکنان متصل به میز:</div>
      <div class="count-big"><span id="joined-count">0</span> / <span id="max-count">4</span> نفر</div>
      <div id="remaining-text" style="font-size: 13px; color: #38bdf8; font-weight: bold;">در حال بررسی وضعیت میز...</div>
    </div>

    <div class="invite-box">
      <label for="invite-target" style="font-size: 12px; color: #cbd5e1;">دعوت با آیدی عددی تلگرام (مثلاً 123456789) یا @username:</label>
      <input id="invite-target" class="input-id" type="text" placeholder="آیدی عددی یا @username دوستت را بزن" />
      <button id="btn-invite-id" type="button" class="btn btn-invite">📩 ثبت دعوت با آیدی تلگرام</button>
      <div id="invited-list" style="font-size: 12px; color: #94a3b8; margin-top: 6px;"></div>
    </div>

    <ul id="players-ul" class="player-list"></ul>

    <button id="btn-leave" type="button" class="btn btn-leave">خروج از میز</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="./app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ساواش | لابی و دوستان</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#090512;--card:#140c24;--card2:#1c1133;--neon:#a855f7;--neon2:#ec4899;--gold:#facc15;--ok:#34d399;--err:#f87171;--txt:#f5f3ff;--mut:#a78bfa;--bd:rgba(168,85,247,.26)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;padding:0;overflow-x:hidden;background:radial-gradient(circle at top,#241046 0%,var(--bg) 72%);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
    .app{max-width:460px;margin:0 auto;padding:14px 14px 86px}
    .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 14px;margin-bottom:14px}
    .user-box{display:flex;align-items:center;gap:10px}
    .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff}
    .uname{font-size:14px;font-weight:800}.uid{font-size:11px;color:var(--mut)}
    .sav-pill{display:flex;align-items:center;gap:7px;background:#1e1236;border:1px solid rgba(250,204,21,.45);padding:6px 12px;border-radius:999px;font-weight:900;font-size:14px;color:var(--gold)}
    .sav-coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fef08a,#eab308 65%,#a16207);border:1.5px solid #fffbeb;color:#422006;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
    .view{display:none}.view.active{display:block}
    .box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
    .title{font-size:14px;font-weight:900;color:#f3e8ff;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
    .lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .game-card{background:var(--card2);border:1px solid var(--bd);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer}
    .game-card.selected{border-color:var(--gold);box-shadow:0 0 18px rgba(250,204,21,.18)}
    .g-ico{font-size:28px;margin-bottom:6px}.g-name{font-size:14px;font-weight:900}.g-sub{font-size:11px;color:var(--mut);margin-top:3px}
    .bets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
    .bet-chip{border:1px solid var(--bd);background:var(--card2);color:#e9d5ff;border-radius:11px;padding:8px 6px;font-size:12px;font-weight:900;cursor:pointer;text-align:center}
    .bet-chip.active{border-color:var(--gold);color:var(--gold);background:#281447}
    .add-row{display:flex;gap:8px}
    .inp{flex:1;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;color:#fff;font-size:13px;outline:none}
    .btn{border:none;border-radius:12px;padding:10px 14px;font-weight:900;font-size:12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--neon),var(--neon2))}
    .btn-gold{background:linear-gradient(135deg,#facc15,#f59e0b);color:#1d1200}
    .btn-ok{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
    .btn-sm{padding:7px 10px;font-size:11px;border-radius:10px}
    .list{display:flex;flex-direction:column;gap:8px}
    .item{background:var(--card2);border:1px solid rgba(168,85,247,.18);border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .item-meta{font-size:11px;color:var(--mut)}
    .msg{min-height:20px;font-size:12px;font-weight:800;color:var(--ok);margin-top:8px}
    .msg.err{color:var(--err)}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;background:#110820;border-top:1px solid var(--bd);display:grid;grid-template-columns:1fr 1fr;padding:8px 8px 10px;z-index:20}
    .nav-btn{border:none;background:transparent;color:var(--mut);font-size:12px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
    .nav-btn.active{color:var(--gold)}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="user-box">
        <div class="avatar" id="avTxt">ک</div>
        <div><div class="uname" id="nameTxt">کاربر</div><div class="uid" id="idTxt">ID: ---</div></div>
      </div>
      <div class="sav-pill"><span class="sav-coin">S</span><span id="savBal">0 SAV</span></div>
    </header>

    <section class="view active" id="view-lobby">
      <div class="box">
        <div class="title"><span>🏛️ لابی ساواش</span><span style="font-size:11px;color:var(--mut)">حالت بازی</span></div>
        <div class="lobby-grid">
          <div class="game-card selected" data-game="دوز"><div class="g-ico">❌⭕</div><div class="g-name">دوز</div><div class="g-sub">دعوت شرطی با دوست</div></div>
          <div class="game-card" data-game="شطرنج"><div class="g-ico">♟️</div><div class="g-name">شطرنج</div><div class="g-sub">دعوت شرطی با دوست</div></div>
        </div>
      </div>

      <div class="box" id="wagerBox">
        <div class="title"><span>⚔️ میز شرطی — <span id="selectedGameName">دوز</span></span><span style="font-size:11px;color:var(--mut)">۱۰٪ کارمزد کل</span></div>
        <div class="bets">
          <button type="button" class="bet-chip active" data-bet="100">100 SAV</button>
          <button type="button" class="bet-chip" data-bet="200">200 SAV</button>
          <button type="button" class="bet-chip" data-bet="300">300 SAV</button>
        </div>
        <div class="title" style="margin-top:8px"><span>👥 دعوت دوست در <span id="inviteGameLabel">دوز</span></span></div>
        <div class="list" id="lobbyFriendsList"></div>
      </div>

      <div class="box">
        <div class="title"><span>📩 دعوت‌های دریافتی</span></div>
        <div class="list" id="invitesList"></div>
      </div>
    </section>

    <section class="view" id="view-friends">
      <div class="box">
        <div class="title"><span>➕ پیدا کردن و افزودن دوست</span></div>
        <div class="add-row">
          <input type="text" id="friendIdInp" class="inp" placeholder="آیدی عددی دوست (مثلاً 8792765101)" />
          <button type="button" class="btn" id="addFriendBtn">افزودن</button>
        </div>
      </div>

      <div class="box">
        <div class="title"><span>👥 لیست دوستان من</span><span id="friendsCount" style="font-size:11px;color:var(--mut)">0 نفر</span></div>
        <div class="list" id="friendsTabList"></div>
      </div>
    </section>

    <div class="msg" id="statusMsg"></div>
  </div>

  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" data-view="lobby"><span>🏛️</span><span>لابی</span></button>
    <button type="button" class="nav-btn" data-view="friends"><span>👥</span><span>دوستان</span></button>
  </nav>

  <script>
    const DB_URL="https://savash-c4207-default-rtdb.europe-west1.firebasedatabase.app",K="savash_coin_state_v1";
    const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
    if(tg){tg.ready();tg.expand()}
    const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    const uid=(u&&u.id)?String(u.id):("u_"+(localStorage.getItem("savash_gid")||(()=>{const g=Math.random().toString(36).slice(2,8);localStorage.setItem("savash_gid",g);return g})()));
    let st=(()=>{const d={name:(u&&u.first_name)||"کاربر",sav:0};try{return{...d,...JSON.parse(localStorage.getItem(K)||"{}"),name:d.name}}catch(_){return d}})();
    let selectedGame="دوز",bet=100,friendsMap={},invitesMap={};

    function setMsg(t,isErr=false){
      const el=document.getElementById("statusMsg");
      el.textContent=t;el.className=isErr?"msg err":"msg";
    }
    async function fbGet(p){const r=await fetch(`${DB_URL}${p}.json`);return r.json()}
    async function fbPut(p,d){await fetch(`${DB_URL}${p}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})}
    async function fbPatch(p,d){await fetch(`${DB_URL}${p}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})}

    function enterGameRoom(gameName,roomId,amt,role){
      const targetUrl=(gameName==="شطرنج")?"chess.html":"dooz/dooz.html";
      const q=`?room=${encodeURIComponent(roomId)}&bet=${encodeURIComponent(amt)}&role=${encodeURIComponent(role)}&uid=${encodeURIComponent(uid)}`;
      location.href=targetUrl+q;
    }

    function renderTop(){
      document.getElementById("nameTxt").textContent=st.name;
      document.getElementById("idTxt").textContent="ID: "+uid;
      document.getElementById("avTxt").textContent=(st.name||"ک").trim().charAt(0).toUpperCase();
      document.getElementById("savBal").textContent=Number(st.sav||0).toLocaleString("en-US")+" SAV";
      document.getElementById("selectedGameName").textContent=selectedGame;
      document.getElementById("inviteGameLabel").textContent=selectedGame;
    }

    function renderFriends(){
      const entries=Object.entries(friendsMap||{});
      document.getElementById("friendsCount").textContent=entries.length+" نفر";

      const tabWrap=document.getElementById("friendsTabList");
      const lobbyWrap=document.getElementById("lobbyFriendsList");
      if(!entries.length){
        const emptyHtml='<div class="item-meta">هنوز دوستی اضافه نکردی. از بخش دوستان با آیدی عددی اضافه کن.</div>';
        tabWrap.innerHTML=emptyHtml;lobbyWrap.innerHTML=emptyHtml;return;
      }
      tabWrap.innerHTML="";lobbyWrap.innerHTML="";
      entries.forEach(([fid,f])=>{
        const fname=(f&&f.name)||("کاربر "+fid);

        const rTab=document.createElement("div");rTab.className="item";
        rTab.innerHTML=`<div><div style="font-size:13px;font-weight:800">${fname}</div><div class="item-meta">ID: ${fid}</div></div><button type="button" class="btn btn-sm">دعوت در ${selectedGame}</button>`;
        rTab.querySelector("button").onclick=()=>{switchView("lobby");sendBetInvite(fid,fname)};
        tabWrap.appendChild(rTab);

        const rLobby=document.createElement("div");rLobby.className="item";
        rLobby.innerHTML=`<div><div style="font-size:13px;font-weight:800">${fname}</div><div class="item-meta">ID: ${fid}</div></div><button type="button" class="btn btn-gold btn-sm">دعوت (${bet} SAV)</button>`;
        rLobby.querySelector("button").onclick=()=>sendBetInvite(fid,fname);
        lobbyWrap.appendChild(rLobby);
      });
    }

    function renderInvites(){
      const wrap=document.getElementById("invitesList");
      const entries=Object.entries(invitesMap||{}).filter(([,v])=>v&&v.status==="pending");
      if(!entries.length){wrap.innerHTML='<div class="item-meta">دعوت بازی شرطی جدیدی نداری.</div>';return}
      wrap.innerHTML="";
      entries.forEach(([iid,inv])=>{
        const row=document.createElement("div");row.className="item";
        const amt=Number(inv.bet||100);
        row.innerHTML=`<div><div style="font-size:13px;font-weight:800">${inv.game||"بازی"} • از ${inv.fromName||inv.fromId}</div><div class="item-meta">شرط: ${amt} SAV • جایزه خالص: ${Math.round(amt*2*0.9)} SAV</div></div><button type="button" class="btn btn-ok btn-sm">قبول و ورود</button>`;
        row.querySelector("button").onclick=()=>acceptBetInvite(iid,inv);
        wrap.appendChild(row);
      });
    }

    function switchView(v){
      document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));
      document.getElementById("view-"+v).classList.add("active");
      document.querySelector(`.nav-btn[data-view="${v}"]`).classList.add("active");
    }

    async function registerMe(){
      try{await fbPatch(`/users/${uid}`,{name:st.name,updatedAt:Date.now()})}catch(_){}
    }

    async function refreshAll(){
      try{
        const s=await fbGet(`/users/${uid}/sav`);
        if(typeof s==="number"){st.sav=s;localStorage.setItem(K,JSON.stringify(st))}
      }catch(_){}
      renderTop();
      try{friendsMap=(await fbGet(`/friends/${uid}`))||{}}catch(_){friendsMap={}}
      try{invitesMap=(await fbGet(`/invites/${uid}`))||{}}catch(_){invitesMap={}}
      renderFriends();renderInvites();
    }

    async function addFriend(){
      const fid=document.getElementById("friendIdInp").value.trim();
      if(!fid){setMsg("آیدی عددی دوست را وارد کن.",true);return}
      if(fid===uid){setMsg("نمی‌توانی خودت را اضافه کنی.",true);return}
      try{
        const target=await fbGet(`/users/${fid}`);
        const fname=(target&&target.name)?target.name:("کاربر "+fid);
        await fbPut(`/friends/${uid}/${fid}`,{name:fname,addedAt:Date.now()});
        await fbPut(`/friends/${fid}/${uid}`,{name:st.name,addedAt:Date.now()});
        document.getElementById("friendIdInp").value="";
        setMsg(`✅ ${fname} (${fid}) به لیست دوستان اضافه شد.`);
        refreshAll();
      }catch(_){setMsg("خطا در ثبت دوست.",true)}
    }

    async function sendBetInvite(fid,fname){
      if(Number(st.sav||0)<bet){setMsg(`موجودی SAV برای دعوت ${bet} SAV کافی نیست.`,true);return}
      const roomId=`room_${uid}_${fid}_${Date.now()}`;
      const iid="inv_"+Date.now();
      try{
        await fbPut(`/rooms/${roomId}`,{game:selectedGame,bet:bet,hostId:uid,guestId:fid,status:"waiting",createdAt:Date.now()});
        await fbPut(`/invites/${fid}/${iid}`,{roomId:roomId,fromId:uid,fromName:st.name,game:selectedGame,bet:bet,status:"pending",createdAt:Date.now()});
        st.sav=Number(st.sav||0)-bet;
        localStorage.setItem(K,JSON.stringify(st));
        await fbPut(`/users/${uid}/sav`,st.sav);
        enterGameRoom(selectedGame,roomId,bet,"host");
      }catch(_){setMsg("ارسال دعوت ناموفق بود.",true)}
    }

    async function acceptBetInvite(iid,inv){
      const amt=Number(inv.bet||100);
      const roomId=inv.roomId||("room_"+(inv.fromId||"p1")+"_"+uid);
      const gameName=inv.game||"دوز";
      if(Number(st.sav||0)<amt){setMsg(`موجودی SAV برای قبول دعوت (${amt} SAV) کافی نیست.`,true);return}
      st.sav=Number(st.sav||0)-amt;
      localStorage.setItem(K,JSON.stringify(st));
      try{
        await fbPut(`/users/${uid}/sav`,st.sav);
        await fbPatch(`/invites/${uid}/${iid}`,{status:"accepted",acceptedBy:uid,acceptedAt:Date.now()});
        await fbPatch(`/rooms/${roomId}`,{guestId:uid,status:"active",startedAt:Date.now()});
        enterGameRoom(gameName,roomId,amt,"guest");
      }catch(_){setMsg("خطا در ورود به میز بازی.",true)}
    }

    document.querySelectorAll(".game-card").forEach(c=>c.onclick=()=>{
      document.querySelectorAll(".game-card").forEach(x=>x.classList.remove("selected"));
      c.classList.add("selected");selectedGame=c.dataset.game;
      renderTop();renderFriends();
      setMsg(`بازی ${selectedGame} انتخاب شد.`);
    });
    document.querySelectorAll(".bet-chip").forEach(c=>c.onclick=()=>{
      document.querySelectorAll(".bet-chip").forEach(x=>x.classList.remove("active"));
      c.classList.add("active");bet=Number(c.dataset.bet);renderFriends();
    });
    document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>switchView(b.dataset.view));
    document.getElementById("addFriendBtn").onclick=addFriend;
    renderTop();registerMe();refreshAll();setInterval(refreshAll,4000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ساواش | SAV</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#090512;--card:#140c24;--neon:#a855f7;--neon2:#ec4899;--gold:#facc15;--txt:#f5f3ff;--mut:#a78bfa;--bd:rgba(168,85,247,.26)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;padding:0;overflow-x:hidden;background:radial-gradient(circle at top,#241046 0%,var(--bg) 72%);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
    .app{max-width:460px;margin:0 auto;padding:14px}
    .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 14px;margin-bottom:14px}
    .user-box{display:flex;align-items:center;gap:10px}
    .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff}
    .uname{font-size:14px;font-weight:800}.uid{font-size:11px;color:var(--mut)}
    .sav-pill{display:flex;align-items:center;gap:7px;background:#1e1236;border:1px solid rgba(250,204,21,.45);padding:6px 12px;border-radius:999px;font-weight:900;font-size:14px;color:var(--gold)}
    .sav-coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fef08a,#eab308 65%,#a16207);border:1.5px solid #fffbeb;color:#422006;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
    .canvas-box{background:var(--card);border:1px dashed var(--bd);border-radius:18px;padding:24px 16px;text-align:center;color:var(--mut);font-size:13px}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="user-box">
        <div class="avatar" id="avTxt">ک</div>
        <div><div class="uname" id="nameTxt">کاربر</div><div class="uid" id="idTxt">ID: ---</div></div>
      </div>
      <div class="sav-pill"><span class="sav-coin">S</span><span id="savBal">0 SAV</span></div>
    </header>
    <div class="canvas-box" id="canvasBox">صفحه اصلی آماده است — مورد اول را بگو</div>
  </div>
  <script>
    const DB_URL="https://savash-c4207-default-rtdb.europe-west1.firebasedatabase.app",K="savash_coin_state_v1";
    const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
    if(tg){tg.ready();tg.expand()}
    const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    const uid=(u&&u.id)?String(u.id):("u_"+(localStorage.getItem("savash_gid")||(()=>{const g=Math.random().toString(36).slice(2,8);localStorage.setItem("savash_gid",g);return g})()));
    let st=(()=>{const d={name:(u&&u.first_name)||"کاربر",sav:0};try{return{...d,...JSON.parse(localStorage.getItem(K)||"{}"),name:d.name}}catch(_){return d}})();
    function render(){
      document.getElementById("nameTxt").textContent=st.name;
      document.getElementById("idTxt").textContent="ID: "+uid;
      document.getElementById("avTxt").textContent=(st.name||"ک").trim().charAt(0).toUpperCase();
      document.getElementById("savBal").textContent=Number(st.sav||0).toLocaleString("en-US")+" SAV";
    }
    async function pull(){try{const r=await fetch(`${DB_URL}/users/${uid}/sav.json`),v=await r.json();if(typeof v==="number"){st.sav=v;localStorage.setItem(K,JSON.stringify(st));render()}}catch(_){}}
    render();pull();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GermGame - منوی اصلی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; font-family: Tahoma, sans-serif; background: #0d0914; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .header { width: 100%; max-width: 400px; background: #181429; border: 1px solid #312450; border-radius: 16px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ff4d5a; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .balance { background: #261b40; padding: 6px 12px; border-radius: 20px; color: #facc15; font-weight: bold; border: 1px solid #4a337a; }
    .section-title { width: 100%; max-width: 400px; font-size: 14px; color: #a5b4fc; margin-bottom: 10px; padding-right: 5px; }
    .game-card { width: 100%; max-width: 400px; background: #181429; border: 2px solid #312450; border-radius: 20px; padding: 25px; text-align: center; cursor: pointer; transition: all 0.3s ease; margin-bottom: 20px; }
    .game-card:hover { transform: translateY(-3px); border-color: #ff4d5a; }
    .icon-ox { font-size: 40px; font-weight: 900; color: #ff4d5a; text-shadow: 0 0 20px rgba(255, 77, 90, 0.6); margin-bottom: 10px; }
    .icon-4x4 { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
    .dot { width: 16px; height: 16px; border-radius: 50%; background: #ff4d5a; box-shadow: 0 0 15px #ff4d5a; }
    .game-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
    .game-desc { font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="user-info">
      <div class="avatar" id="userInitial">س</div>
      <div style="font-weight: bold;" id="userName">ساواش</div>
    </div>
    <div class="balance">SAV <span id="userBalance">4,480</span></div>
  </div>
  <div class="section-title">انتخاب بازی</div>
  <div class="game-card" onclick="openGame('dooz3')">
    <div class="icon-ox">OX</div>
    <div class="game-title">دوز کلاسیک (3x3)</div>
    <div class="game-desc">کلاسیک و نوستالژیک • شرط‌بندی سریع</div>
  </div>
  <div class="game-card" onclick="openGame('dooz4')">
    <div class="icon-4x4">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="game-title">دوز چهار تایی (Connect 4)</div>
    <div class="game-desc">اتصال ۴ مهره در یک ستون یا ردیف • هیجان بالا</div>
  </div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    function openGame(type) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      const baseUrl = window.location.href.replace(/[^/]*$/, '');
      window.location.href = baseUrl + (type === 'dooz3' ? 'dooz3.html' : 'dooz4.html');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dooz-mini</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 18px;
      font-family: sans-serif;
      background: #0d0717;
      color: #ffffff;
    }
    .panel {
      max-width: 440px;
      margin: 16px auto;
      background: #190f2b;
      border: 1px solid #5e2ced;
      border-radius: 16px;
      padding: 18px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 20px;
      color: #efe5ff;
    }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 13px;
      color: #cbb8ff;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid #3c266e;
      background: #0e071a;
      color: #fff;
      font-size: 15px;
    }
    .btn {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #7c3aed;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-secondary {
      background: #2b184d;
      border: 1px solid #6d3df2;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Dooz-mini</h1>

    <label for="deposit-amount">مبلغ واریز کارت‌به‌کارت (تومان)</label>
    <input id="deposit-amount" type="number" value="100000" min="1000" />

    <label for="card-ref">۴ رقم آخر کارت یا کد پیگیری</label>
    <input id="card-ref" type="text" placeholder="مثلاً 1234" />

    <button id="card-deposit-btn" class="btn" type="button" onclick="window.submitCardDeposit()">
      ثبت واریز کارت‌به‌کارت
    </button>

    <button class="btn btn-secondary" type="button" onclick="window.location.href='wallet.html'">
      صفحه کیف پول (wallet.html)
    </button>
  </div>

  <script src="app.js"></script>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>

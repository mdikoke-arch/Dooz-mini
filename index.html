<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Games</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c0e0b;
      --surface: #141812;
      --card: #191e16;
      --gold: #facc15;
      --green-banner: linear-gradient(135deg, #114b32 0%, #09261a 100%);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0; padding: 0 0 82px 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    .app { max-width: 460px; margin: 0 auto; padding: 12px 14px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 2px 12px; gap: 10px;
    }
    .top-left { display: flex; align-items: center; gap: 14px; font-size: 20px; color: var(--gold); }
    .icon-btn { background: none; border: none; color: var(--gold); font-size: 20px; padding: 4px; cursor: pointer; }
    .top-right { display: flex; align-items: center; gap: 10px; }
    .user-meta { text-align: left; }
    .player-name { font-weight: 800; font-size: 15px; color: var(--gold); line-height: 1.2; }
    .gem-sub { font-size: 12px; color: #e5e7eb; font-weight: 600; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: #1f291d; border: 1.5px solid rgba(250, 204, 21, 0.45);
      display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--gold);
    }
    .promo-banner {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--green-banner); border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .promo-title { font-size: 18px; font-weight: 800; color: #ffffff; margin-bottom: 4px; }
    .promo-sub { font-size: 12px; color: #d1fae5; }
    .promo-badge {
      width: 48px; height: 48px; border-radius: 12px;
      background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(250, 204, 21, 0.45);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; color: var(--gold);
    }
    .seg-bar {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 5px; margin-bottom: 14px;
    }
    .seg-btn {
      border: none; border-radius: 10px; padding: 10px 8px;
      background: transparent; color: #d1d5db; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .seg-btn.active { background: var(--gold); color: #11130f; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .game-card {
      position: relative; aspect-ratio: 1 / 1.05; border-radius: 18px;
      overflow: hidden; background: var(--card); border: 1px solid var(--border);
      cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
      padding: 10px; text-align: right;
    }
    .game-card:active { transform: scale(0.97); }
    .card-bg {
      position: absolute; inset: 0; opacity: 0.45; z-index: 0;
      display: flex; align-items: center; justify-content: center; font-size: 56px;
    }
    .card-top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
    .players-tag {
      background: rgba(15, 23, 18, 0.85); border: 1px solid rgba(255,255,255,0.12);
      color: #e5e7eb; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    }
    .game-name {
      position: relative; z-index: 1; text-align: center;
      font-size: 20px; font-weight: 900; color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9); padding-bottom: 4px;
    }
    .page { display: none; }
    .page.active { display: block; }
    .box-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; margin-bottom: 10px; font-size: 13px;
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #141712; border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 30;
    }
    .bnav-btn {
      background: none; border: none; color: #9ca3af;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 700; padding: 4px 2px; cursor: pointer;
    }
    .bnav-btn.active { color: var(--gold); }
    .bnav-ico { font-size: 18px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="top-left">
        <button type="button" class="icon-btn" id="menuBtn" title="منو">☰</button>
        <button type="button" class="icon-btn" id="themeBtn" title="تم">☾</button>
      </div>
      <div class="top-right">
        <div class="user-meta">
          <div class="player-name" id="topName">کاربر</div>
          <div class="gem-sub" id="gemSub">💎 ۰ الماس</div>
        </div>
        <div class="avatar" id="avatarBox">ک</div>
      </div>
    </header>

    <main class="page active" id="page-games">
      <div class="promo-banner">
        <div>
          <div class="promo-title">کلاب بازی</div>
          <div class="promo-sub">«دورِ هم، هر جا که باشی»</div>
        </div>
        <div class="promo-badge">G</div>
      </div>

      <div class="seg-bar">
        <button type="button" class="seg-btn active" id="segBoard">⊞ بازی‌های تخته‌ای</button>
        <button type="button" class="seg-btn" id="segCard">🃏 بازی‌های کارتی</button>
      </div>

      <div class="grid-2" id="gamesGrid"></div>
    </main>

    <section class="page" id="page-friends">
      <div class="box-card"><strong>دوستان</strong><br/>لیست دوستان شما هنوز خالی است.</div>
    </section>

    <section class="page" id="page-chat">
      <div class="box-card"><strong>گفتگو</strong><br/>بخش چت و چالش‌های سریع به زودی فعال می‌شود.</div>
    </section>

    <section class="page" id="page-leaders">
      <div class="box-card" id="leadersBox"><strong>برترین‌ها</strong><br/>موجودی فعلی شما: ۰ الماس</div>
    </section>

    <section class="page" id="page-profile">
      <div class="box-card" id="profileBox">
        <strong>پروفایل</strong><br/>
        نام: <span id="profName">کاربر</span><br/>
        موجودی الماس: <span id="profGems">۰</span>
      </div>
    </section>
  </div>

  <nav class="bottom-nav">
    <button type="button" class="bnav-btn active" data-page="games"><span class="bnav-ico">🎲</span><span>بازی‌ها</span></button>
    <button type="button" class="bnav-btn" data-page="friends"><span class="bnav-ico">👥</span><span>دوستان</span></button>
    <button type="button" class="bnav-btn" data-page="chat"><span class="bnav-ico">💬</span><span>گفتگو</span></button>
    <button type="button" class="bnav-btn" data-page="leaders"><span class="bnav-ico">🏆</span><span>برترین‌ها</span></button>
    <button type="button" class="bnav-btn" data-page="profile"><span class="bnav-ico">👤</span><span>پروفایل</span></button>
  </nav>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    const KEY = "mini_games_state_v1";
    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;

    const state = (() => {
      const def = { name: (tgUser && tgUser.first_name) || "کاربر", gems: 0 };
      try {
        const raw = localStorage.getItem(KEY);
        return raw ? { ...def, ...JSON.parse(raw), name: def.name } : def;
      } catch (_) { return def; }
    })();

    const BOARD_GAMES = [
      { title: "منچ", players: "۴ نفره", icon: "🎲", grad: "linear-gradient(160deg,#183622,#0f1712)" },
      { title: "شطرنج", players: "۲ نفره", icon: "♟", grad: "linear-gradient(160deg,#132b20,#111412)" },
      { title: "تخته نرد", players: "۲ نفره", icon: "⛀", grad: "linear-gradient(160deg,#292112,#121411)" },
      { title: "دوز", players: "۲ نفره", icon: "✕○", grad: "linear-gradient(160deg,#1a2636,#101412)" },
      { title: "مارپله", players: "۲ یا ۴", icon: "🐍", grad: "linear-gradient(160deg,#2a1816,#121310)" },
      { title: "چالش انفرادی", players: "تک‌نفره", icon: "⚡", grad: "linear-gradient(160deg,#162a24,#101311)" }
    ];

    const CARD_GAMES = [
      { title: "حکم", players: "۴ نفره", icon: "♠", grad: "linear-gradient(160deg,#143326,#0e1411)" },
      { title: "چهار برگ", players: "۲ یا ۴", icon: "♦", grad: "linear-gradient(160deg,#2c1619,#111311)" }
    ];

    let activeCategory = "board";

    function syncUI() {
      document.getElementById("topName").textContent = state.name;
      document.getElementById("gemSub").textContent = `💎 ${state.gems} الماس`;
      document.getElementById("profName").textContent = state.name;
      document.getElementById("profGems").textContent = state.gems;
      document.getElementById("leadersBox").innerHTML = `<strong>برترین‌ها</strong><br/>موجودی فعلی شما: 💎 ${state.gems}`;
      const ch = (state.name || "ک").trim().charAt(0).toUpperCase();
      document.getElementById("avatarBox").textContent = ch || "ک";
    }

    function renderGames() {
      const list = activeCategory === "board" ? BOARD_GAMES : CARD_GAMES;
      const grid = document.getElementById("gamesGrid");
      grid.innerHTML = list.map((g) => `
        <button type="button" class="game-card" style="background:${g.grad}" data-game="${g.title}">
          <div class="card-bg">${g.icon}</div>
          <div class="card-top"><span class="players-tag">${g.players}</span></div>
          <div class="game-name">${g.title}</div>
        </button>
      `).join("");

      grid.querySelectorAll(".game-card").forEach((card) => {
        card.addEventListener("click", () => {
          const gName = card.dataset.game;
          if (tg && tg.showPopup) {
            tg.showPopup({ title: gName, message: `موجودی شما: ${state.gems} الماس`, buttons: [{ type: "ok" }] });
          }
        });
      });
    }

    document.getElementById("segBoard").addEventListener("click", () => {
      activeCategory = "board";
      document.getElementById("segBoard").classList.add("active");
      document.getElementById("segCard").classList.remove("active");
      renderGames();
    });

    document.getElementById("segCard").addEventListener("click", () => {
      activeCategory = "card";
      document.getElementById("segCard").classList.add("active");
      document.getElementById("segBoard").classList.remove("active");
      renderGames();
    });

    document.querySelectorAll(".bnav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const p = btn.dataset.page;
        document.querySelectorAll(".bnav-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".page").forEach((sec) => sec.classList.remove("active"));
        document.getElementById("page-" + p).classList.add("active");
      });
    });

    syncUI();
    renderGames();
  </script>
</body>
</html>
